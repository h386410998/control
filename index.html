<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>黄老师大屏主控台</title>
    <style>
        /* 内置轻奢粉白流光UI，100%独立运行 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            font-family: 'Microsoft YaHei', sans-serif;
            color: #333;
            background: linear-gradient(-45deg, #ffdeeb, #ffffff, #e3edff, #fff0f5);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            display: flex; justify-content: center; align-items: flex-start;
            padding: 15px; overflow-y: auto;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container-box {
            width: 100%; max-width: 480px; margin: auto; margin-top: 20px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 15px 40px rgba(251, 194, 235, 0.3);
            overflow: hidden;
            position: relative; z-index: 999; /* 确保图层在最前 */
        }
        .header-banner {
            background: linear-gradient(135deg, rgba(251,194,235,0.5) 0%, rgba(166,193,238,0.4) 100%);
            padding: 30px 20px; text-align: center;
            border-bottom: 1px solid rgba(255, 182, 193, 0.3);
        }
        .form-body { padding: 30px 20px; position: relative; z-index: 1000; }
        .input-item { margin-bottom: 20px; }
        .input-item label { display: block; margin-bottom: 8px; font-size: 13px; color: #555; font-weight: bold; }
        .my-input, .my-textarea {
            width: 100%; padding: 14px; background: #ffffff;
            border: 1px solid #e2e8f0; border-radius: 12px;
            font-size: 15px; color: #1a1a1a; outline: none; transition: 0.3s;
        }
        .my-input:focus, .my-textarea:focus { border-color: #fbc2eb; box-shadow: 0 0 10px rgba(251, 194, 235, 0.5); }
        .my-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            border: none; border-radius: 12px; color: #ffffff;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
            box-shadow: 0 6px 15px rgba(166, 193, 238, 0.4);
            display: block; text-align: center;
            position: relative; z-index: 1001; /* 强制提升按钮触控优先级 */
        }
        .my-btn:active { transform: scale(0.98); opacity: 0.9; }
        .radio-cell { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 14px; cursor: pointer; }
        .radio-cell input { accent-color: #ff4d6d; width: 18px; height: 18px; }
        .pill-box { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
        .pill-btn {
            background: #ffffff; border: 1px solid #fbc2eb; color: #ff4d6d;
            padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container-box">
        
        <div class="header-banner">
            <h2 style="color: #ff4d6d; font-size: 24px; font-weight: 800; letter-spacing: 1px;">🌸 黄老师大屏工具</h2>
            <p style="color: #666; font-size: 12px; margin-top: 5px;">无线控制面板 · QQ 386410998</p>
        </div>

        <div id="loginView" class="form-body" style="display: block;">
            <div class="input-item">
                <input type="text" id="uid" class="my-input" placeholder="请输入账户" autocomplete="off">
            </div>
            <div class="input-item">
                <input type="password" id="password" class="my-input" placeholder="请输入密码" autocomplete="new-password">
            </div>
            <button onclick="checkCredentials()" class="my-btn" style="margin-top: 10px;">安全验证进入</button>
        </div>

        <div id="controlView" class="form-body" style="display: none;">
            <div class="input-item">
                <label>📡 本机绑定的信道房间号：</label>
                <input type="text" id="topic" class="my-input" placeholder="须与大屏端一致，如 class_01" autocomplete="off">
            </div>
            
            <div class="input-item">
                <label>📢 广播标题 (选填)：</label>
                <input type="text" id="title" class="my-input" placeholder="例如：紧急通知" autocomplete="off">
            </div>

            <div class="input-item">
                <label>💬 广播文本内容：</label>
                <textarea id="content" class="my-textarea" style="height: 100px; resize: none;" placeholder="请输入需要在教室大屏显示的文字..."></textarea>
            </div>

            <div class="input-item">
                <label>🖥️ 大屏呈现形态：</label>
                <label class="radio-cell"><input type="radio" name="displayMode" value="[BANNER]" checked> 顶部下拉横幅 (自动收起)</label>
                <label class="radio-cell"><input type="radio" name="displayMode" value="[FULLSCREEN]"> 100%全屏霸屏 (自动收起)</label>
            </div>

            <div class="pill-box">
                <button class="pill-btn" onclick="quickFill('上课通知','请同学们迅速回到座位，准备上课。')">🔔 上课</button>
                <button class="pill-btn" onclick="quickFill('收交作业','请各组组长现在收齐作业交到讲台。')">📝 收作业</button>
                <button class="pill-btn" style="border-color: #d63031; color: #d63031;" onclick="sendForceClose('[CLOSE_SCREEN]')">❌ 强制收起大屏</button>
            </div>

            <button onclick="transmitSignal()" id="sendBtn" class="my-btn" style="margin-top: 30px; background: linear-gradient(135deg, #ff7675 0%, #ff4d6d 100%);">🚀 立即发射全息广播</button>
            <div id="statusTip" style="text-align: center; margin-top: 15px; font-size: 13px; font-weight: bold; min-height: 20px;"></div>
        </div>

    </div>

    <script>
        function checkCredentials() {
            const u = document.getElementById('uid').value.trim();
            const p = document.getElementById('password').value.trim();

            if (u === 'admin' && p === '20262026') {
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('controlView').style.display = 'block';
            } else {
                alert('安全验证失败！请检查账户和密码。');
            }
        }

        function quickFill(t, c) {
            document.getElementById('title').value = t;
            document.getElementById('content').value = c;
        }

        async function transmitSignal() {
            const topic = document.getElementById('topic').value.trim();
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            const mode = document.querySelector('input[name="displayMode"]:checked').value;

            if (!topic) { alert("房间号不能为空！"); return; }
            if (!content) { alert("通知内容不能为空！"); return; }

            let payload = mode + (title ? `【${title}】` : "") + content;
            pushToCloud(topic, payload);
        }

        function sendForceClose(cmd) {
            const topic = document.getElementById('topic').value.trim();
            if (!topic) { alert("请先填写房间号！"); return; }
            pushToCloud(topic, cmd);
        }

        async function pushToCloud(room, data) {
            const tip = document.getElementById('statusTip');
            const btn = document.getElementById('sendBtn');
            
            tip.innerHTML = "<span style='color:#0984e3;'>📡 正在向云端信标发射波段...</span>";
            btn.disabled = true;

            try {
                await fetch(`https://ntfy.sh/${room}`, {
                    method: 'POST',
                    body: data,
                    headers: { 'Content-Type': 'text/plain; charset=utf-8' }
                });
                tip.innerHTML = "<span style='color:#00b894;'>✅ 信号发射成功！大屏正在响应。</span>";
                document.getElementById('content').value = '';
            } catch (e) {
                tip.innerHTML = "<span style='color:#d63031;'>❌ 发射失败，请检查手机网络连通性。</span>";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
